name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · types · tests · coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: peerreview
          POSTGRES_USER: peerreview
          POSTGRES_PASSWORD: peerreview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peerreview" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://peerreview:peerreview@localhost:5432/peerreview
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make check
      - run: make security
        continue-on-error: true  # информативно; не блокирует PR

  e2e:
    name: e2e (Playwright)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: make e2e
        env:
          PYTEST_ADDOPTS: --tracing=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
