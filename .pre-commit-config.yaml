repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: migrations-check
        name: makemigrations --check
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        files: models\.py$
      - id: no-env
        name: запрет коммита .env
        entry: .env files must not be committed
        language: fail
        files: (^|/)\.env$
