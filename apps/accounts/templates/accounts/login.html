{% extends "base.html" %}
{% block title %}Вход — Peer Review{% endblock %}
{% block content %}
  <div class="card card--plain sheet">
    <h1>Вход</h1>
    <form class="form-narrow" method="post" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      {% include "_form_fields.html" with form=form %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <p>
      Нет учётной записи? <a href="{% url 'accounts:signup' %}">Зарегистрируйтесь</a>
    </p>
  </div>
{% endblock %}
