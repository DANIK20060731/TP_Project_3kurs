{% extends "base.html" %}
{% block title %}Регистрация — Peer Review{% endblock %}
{% block content %}
  <h1>Регистрация</h1>
  <form method="post" action="{% url 'accounts:signup' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Зарегистрироваться</button>
  </form>
  <p>
    Уже зарегистрированы? <a href="{% url 'accounts:login' %}">Вход</a>
  </p>
{% endblock %}
